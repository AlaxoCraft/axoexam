function renderOperator(){$('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand"><div class="brandLogo">AX</div>AxoExam</div><div class="build">operator://console</div><nav class="nav"><button class="active" onclick="opPage('dashboard',this)"><span>01</span>Dashboard</button><button onclick="opPage('exams',this)"><span>02</span>Kelola Ujian</button><button onclick="opPage('bank',this)"><span>03</span>Bank Soal</button><button onclick="opPage('participants',this)"><span>04</span>Peserta</button><button onclick="opPage('monitor',this)"><span>05</span>Monitoring</button><button onclick="opPage('scores',this)"><span>06</span>Rekap Nilai</button></nav></aside><div><header class="topbar"><div class="topRight"><div class="live"><i></i> REALTIME</div><div class="clock">◷ <span id="opClock"></span></div><div class="avatar">OP</div><button class="logout" onclick="logout()">Keluar</button></div></header><main id="operatorContent" class="content"></main></div></div>`;opPage('dashboard');liveTick=setInterval(()=>{if($('opClock'))$('opClock').textContent=clock();refreshActivePage()},1000)}
function refreshActivePage(){if(activeRole==='operator'&&$('operatorContent'))opPage(activeOperatorPage,null,true)}function opPage(page,btn,norefresh=false){activeOperatorPage=page;if(btn){document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}const el=$('operatorContent');if(!el)return;if(page==='dashboard')renderDashboard(el);if(page==='exams')renderExamAdmin(el);if(page==='bank')renderBank(el);if(page==='participants')renderParticipantAdmin(el);if(page==='monitor')renderMonitor(el);if(page==='scores')renderScores(el)}
function renderDashboard(el){const exams=get('axo_exams',[]),a=get('axo_accounts',{}),results=get('axo_results',[]),v=get('axo_violations',[]);el.innerHTML=`<div class="pageHead"><div><h1>Dashboard / Runtime</h1><p>Live operator overview · sinkron setiap 1 detik</p></div><button class="btn btnGreen" onclick="generateToken()">＋ Generate token</button></div><div class="stats"><div class="stat"><div class="statTop">Peserta aktif <b>${a.participants.length}</b></div><strong>${a.participants.length}</strong></div><div class="stat"><div class="statTop">Ujian berjalan <b>LIVE</b></div><strong>${exams.filter(e=>e.status==='Berjalan').length}</strong></div><div class="stat"><div class="statTop">Sudah selesai <b>SYNC</b></div><strong>${results.length}</strong></div><div class="stat"><div class="statTop">Daftar pelanggaran <b>LOG</b></div><strong>${v.length}</strong></div></div><div class="grid2"><div class="card"><h3>Daftar Pelanggaran</h3>${v.length?v.slice(-6).reverse().map(x=>`<div class="statusRow"><span><b>${esc(x.user)}</b> · ${esc(x.type)}</span><span class="mono amberText">${esc(x.time||'')}</span></div>`).join(''):'<div class="statusRow"><span>Belum ada pelanggaran</span><b class="greenText mono">CLEAR</b></div>'}</div><div class="card"><h3>system.status</h3><div class="statusRow"><span>Database browser</span><b class="greenText mono" id="dbStatus">ONLINE</b></div><div class="statusRow"><span>Realtime clock</span><b class="greenText mono">${clock()}</b></div><div class="statusRow"><span>Cross-tab storage</span><b class="greenText mono">SYNCED</b></div><div class="statusRow"><span>Auto-submit engine</span><b class="greenText mono">READY</b></div></div></div><div class="card" style="margin-top:10px"><h3>Token aktif per mata pelajaran</h3>${examTokenRows()}</div>`}
function examTokenRows(){return get('axo_exams',[]).map(e=>`<div class="statusRow"><span><b>${esc(e.subject)}</b> · ${esc(e.title)}</span><span><b class="token">${esc(e.token||'-')}</b> <button class="iconBtn" onclick="deleteToken('${e.id}')" title="Hapus token">⌫</button></span></div>`).join('')||'<div class="statusRow">Belum ada ujian</div>'}
function generateToken(){const exams=get('axo_exams',[]);$('overlay').innerHTML=`<div class="modalBack"><div class="modal" style="max-width:440px"><h2>Generate Token Mata Pelajaran</h2><div class="field"><label>Ujian</label><select id="tokenExam">${exams.map(e=>`<option value="${e.id}">${esc(e.subject)} — ${esc(e.title)}</option>`).join('')}</select></div><div class="modalActions"><button class="btn" onclick="closeOverlay()">Batal</button><button class="btn btnGreen" onclick="createToken()">Generate</button></div></div></div>`}function createToken(){const exams=get('axo_exams',[]),e=exams.find(x=>x.id===$('tokenExam').value),a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',code='AXO-'+Array.from({length:4},()=>a[Math.floor(Math.random()*a.length)]).join('');e.token=code;set('axo_exams',exams);closeOverlay();toast('Token '+code+' dibuat untuk '+e.subject)}function deleteToken(id){const exams=get('axo_exams',[]),e=exams.find(x=>x.id===id);e.token='';set('axo_exams',exams);toast('Token '+e.subject+' dihapus',true)}
function renderExamAdmin(el){const exams=get('axo_exams',[]);el.innerHTML=`<div class="pageHead"><div><h1>Kelola Ujian / Scheduler</h1><p>CRUD ujian · sinkron otomatis dengan bank soal</p></div><button class="btn btnGreen" onclick="examForm()">＋ Buat Ujian Baru</button></div><div class="card"><table class="table"><thead><tr><th>Ujian</th><th>Mata pelajaran</th><th>Jadwal</th><th>Durasi</th><th>Token</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${exams.map(e=>`<tr><td><b>${esc(e.title)}</b></td><td>${esc(e.subject)}</td><td>${esc(e.date)}</td><td>${e.duration} menit</td><td><span class="token">${esc(e.token||'-')}</span></td><td><span class="badge ${e.status==='Terjadwal'?'warn':''}">${esc(e.status)}</span></td><td><div class="actions"><button class="iconBtn" title="Edit" onclick="examForm('${e.id}')">✎</button><button class="iconBtn" title="Status" onclick="toggleExam('${e.id}')">◉</button><button class="iconBtn" title="Hapus" onclick="deleteExam('${e.id}')">⌫</button></div></td></tr>`).join('')}</tbody></table></div>`}
function examForm(id){const exams=get('axo_exams',[]),e=id?exams.find(x=>x.id===id):null;$('overlay').innerHTML=`<div class="modalBack"><div class="modal"><h2>${e?'Edit':'Buat'} Ujian</h2><div class="formGrid"><div class="field"><label>Nama ujian</label><input id="examTitle" value="${e?esc(e.title):''}"></div><div class="field"><label>Mata pelajaran</label><input id="examSubject" value="${e?esc(e.subject):''}"></div><div class="field"><label>Durasi (menit)</label><input id="examDuration" type="number" min="1" value="${e?e.duration:60}"></div><div class="field"><label>Jadwal</label><input id="examDate" value="${e?esc(e.date):'29 Okt 2026, 08:00'}"></div><div class="field"><label>Status</label><select id="examStatus"><option ${e?.status==='Berjalan'?'selected':''}>Berjalan</option><option ${e?.status==='Terjadwal'?'selected':''}>Terjadwal</option><option ${e?.status==='Selesai'?'selected':''}>Selesai</option></select></div></div><div class="modalActions"><button class="btn" onclick="closeOverlay()">Batal</button><button class="btn btnGreen" onclick="saveExam('${e?.id||''}')">Simpan</button></div></div></div>`}
function saveExam(id){const title=$('examTitle').value.trim(),subject=$('examSubject').value.trim(),duration=+$('examDuration').value,date=$('examDate').value.trim(),status=$('examStatus').value;if(!title||!subject||duration<1)return toast('Nama, mapel, dan durasi wajib diisi.',true);const exams=get('axo_exams',[]);if(id){const e=exams.find(x=>x.id===id),old=e.subject;if(old!==subject){let qs=get('axo_questions',[]);qs.forEach(q=>{if(q.subject===old)q.subject=subject});set('axo_questions',qs)}Object.assign(e,{title,subject,duration,date,status})}else{const n=String(exams.length+1).padStart(3,'0');exams.push({id:'EX-'+n,title,subject,duration,date,status,token:''})}set('axo_exams',exams);closeOverlay();renderExamAdmin($('operatorContent'));toast('Ujian berhasil disimpan · bank soal otomatis sinkron')}
function toggleExam(id){const exams=get('axo_exams',[]),e=exams.find(x=>x.id===id);e.status=e.status==='Berjalan'?'Terjadwal':'Berjalan';set('axo_exams',exams);renderExamAdmin($('operatorContent'));toast(e.title+' sekarang '+e.status)}function deleteExam(id){if(!confirm('Hapus ujian ini beserta bank soal, nilai, sesi, dan pelanggaran mapelnya?'))return;const exams=get('axo_exams',[]),e=exams.find(x=>x.id===id);if(!e)return;const remaining=exams.filter(x=>x.id!==id),subject=e.subject,noSubject=!remaining.some(x=>x.subject===subject);set('axo_exams',remaining);set('axo_results',get('axo_results',[]).filter(r=>r.examId!==id&&(!noSubject||r.subject!==subject)));set('axo_sessions',get('axo_sessions',[]).filter(s=>s.examId!==id&&(!noSubject||s.subject!==subject)));set('axo_violations',get('axo_violations',[]).filter(v=>v.examId!==id&&(!noSubject||v.subject!==subject)));if(noSubject)set('axo_questions',get('axo_questions',[]).filter(q=>q.subject!==subject));renderExamAdmin($('operatorContent'));toast('Ujian, mapel, bank soal, dan nilai terkait dihapus',true)}
function renderBank(el){let subjects=[...new Set(get('axo_exams',[]).map(e=>e.subject))];if(!subjects.length)subjects=['Umum'];if(!subjects.includes(bankSubject))bankSubject=subjects[0];el.innerHTML=`<div class="pageHead"><div><h1>Bank Soal / Knowledge Base</h1><p>Sinkron dengan mata pelajaran ujian · impor spreadsheet</p></div><div style="display:flex;gap:7px"><button class="btn btnPrimary" onclick="importBankForm()">⇧ Impor Spreadsheet</button><button class="btn btnGreen" onclick="questionForm()">＋ Tambah Soal</button></div></div><div class="subjectTabs">${subjects.map(s=>`<button class="${s===bankSubject?'active':''}" onclick="bankSubject='${esc(s).replace(/'/g,'&#39;')}';opPage('bank')">${esc(s)}</button>`).join('')}</div><div class="card"><table class="table"><thead><tr><th>ID</th><th>Pertanyaan</th><th>Tipe</th><th>Opsi</th><th>Aksi</th></tr></thead><tbody>${get('axo_questions',[]).filter(q=>q.subject===bankSubject).map(q=>`<tr><td class="token">#${q.id}</td><td><b>${esc(q.text)}</b></td><td>${q.type==='PGK'?'PG Kompleks':'Pilihan Ganda'}</td><td>${q.options.length}</td><td><div class="actions"><button class="iconBtn" onclick="questionForm(${q.id})">✎</button><button class="iconBtn" onclick="deleteQuestion(${q.id})">⌫</button></div></td></tr>`).join('')}</tbody></table></div>`}
function importBankForm(){const subjects=[...new Set(get('axo_exams',[]).map(e=>e.subject))];$('overlay').innerHTML=`<div class="modalBack"><div class="modal"><h2>Impor Bank Soal Spreadsheet</h2><p style="color:var(--muted);font-size:12px">Format kolom: subject, type, question, option1-option4, answer. Type PG atau PGK. Jawaban PGK dipisah koma.</p><div class="field"><label>Mata pelajaran tujuan</label><select id="importSubject">${subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>File CSV/XLSX</label><input id="sheetFile" type="file" accept=".csv,.xlsx,.xls"></div><div class="modalActions"><button class="btn" onclick="closeOverlay()">Batal</button><button class="btn btnGreen" onclick="importSheet()">Impor Data</button></div></div></div>`}
function importSheet(){const f=$('sheetFile').files[0];if(!f)return toast('Pilih file spreadsheet terlebih dahulu.',true);const rd=new FileReader();rd.onload=()=>{try{let rows;if(/\.csv$/i.test(f.name)){rows=rd.result.split(/\r?\n/).filter(Boolean).map(r=>r.split(',').map(v=>v.replace(/^"|"$/g,'').trim()))}else{if(!window.XLSX)return toast('Parser XLSX belum siap.',true);const wb=XLSX.read(rd.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''})}const header=rows.shift().map(v=>String(v).trim().toLowerCase()),idx=n=>header.indexOf(n),subject=$('importSubject').value,qs=get('axo_questions',[]);let max=Math.max(0,...qs.map(q=>+q.id||0)),count=0;rows.forEach(r=>{if(!r[idx('question')])return;const type=(r[idx('type')]||'PG').toUpperCase().includes('PGK')?'PGK':'PG',options=[1,2,3,4].map(i=>r[idx('option'+i)]||'').filter(Boolean),ans=(r[idx('answer')]||'0').toString().split(',').map(v=>+v.trim()).map(v=>v>0?v-1:v).filter(v=>Number.isInteger(v));if(!options.length)return;qs.push({id:++max,subject,type,text:r[idx('question')],options,answer:type==='PGK'?ans:ans.length?[ans[0]]:[0]});count++});set('axo_questions',qs);bankSubject=subject;closeOverlay();opPage('bank');toast(count+' soal berhasil diimpor ke '+subject)}catch(err){toast('Spreadsheet tidak valid.',true)}};if(/\.csv$/i.test(f.name))rd.readAsText(f);else rd.readAsArrayBuffer(f)}
function questionForm(id){const qs=get('axo_questions',[]),q=id?qs.find(x=>x.id===id):null,subjects=[...new Set(get('axo_exams',[]).map(e=>e.subject))];$('overlay').innerHTML=`<div class="modalBack"><div class="modal"><h2>${q?'Edit':'Tambah'} Soal</h2><div class="formGrid"><div class="field"><label>Mata pelajaran</label><select id="qSubject">${subjects.map(s=>`<option ${s===bankSubject?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Tipe</label><select id="qType"><option value="PG" ${q?.type==='PG'?'selected':''}>Pilihan Ganda</option><option value="PGK" ${q?.type==='PGK'?'selected':''}>Pilihan Ganda Kompleks</option></select></div></div><div class="field"><label>Pertanyaan</label><textarea id="qText">${q?esc(q.text):''}</textarea></div><div class="field"><label>Opsi · centang jawaban benar</label><div class="optionEditor">${[0,1,2,3].map(i=>`<div><input type="checkbox" data-answer="${i}" ${q?.answer.includes(i)?'checked':''}><input id="qOption${i}" type="text" value="${q?esc(q.options[i]||''):''}" placeholder="Opsi ${i+1}"></div>`).join('')}</div></div><div class="modalActions"><button class="btn" onclick="closeOverlay()">Batal</button><button class="btn btnGreen" onclick="saveQuestion(${q?.id||''})">Simpan</button></div></div></div>`}
function saveQuestion(id){const text=$('qText').value.trim(),subject=$('qSubject').value,type=$('qType').value,options=[0,1,2,3].map(i=>$('qOption'+i).value.trim()).filter(Boolean),answers=[...document.querySelectorAll('[data-answer]:checked')].map(e=>+e.dataset.answer).filter(i=>i<options.length);if(!text||options.length<2||!answers.length)return toast('Pertanyaan, minimal 2 opsi, dan jawaban wajib diisi.',true);const qs=get('axo_questions',[]);if(id){Object.assign(qs.find(x=>x.id===id),{subject,type,text,options,answer:type==='PGK'?answers:[answers[0]]})}else qs.push({id:Math.max(0,...qs.map(q=>+q.id||0))+1,subject,type,text,options,answer:type==='PGK'?answers:[answers[0]]});set('axo_questions',qs);bankSubject=subject;closeOverlay();renderBank($('operatorContent'));toast('Soal tersimpan dan live')}
function deleteQuestion(id){if(!confirm('Hapus soal ini?'))return;set('axo_questions',get('axo_questions',[]).filter(q=>q.id!==id));renderBank($('operatorContent'));toast('Soal dihapus',true)}
function renderParticipantAdmin(el){const a=get('axo_accounts',{});el.innerHTML=`<div class="pageHead"><div><h1>Peserta / Identity Registry</h1><p>Nama dan kelas membuat username serta password otomatis</p></div><button class="btn btnGreen" onclick="participantForm()">＋ Tambah Peserta</button></div><div class="card"><table class="table"><thead><tr><th>Nama</th><th>Username</th><th>Password</th><th>Kelas</th><th>Aksi</th></tr></thead><tbody>${a.participants.map((p,i)=>`<tr><td><b>${esc(p.name)}</b></td><td class="mono">${esc(p.username)}</td><td class="mono">${esc(p.password)}</td><td>${esc(p.class||'-')}</td><td><div class="actions"><button class="iconBtn" title="Edit nama dan kelas" onclick="participantForm(${i})">✎</button><button class="iconBtn" title="Hapus peserta" onclick="deleteParticipant(${i})">⌫</button></div></td></tr>`).join('')}</tbody></table></div>`}
function nextParticipantUsername(){const accounts=get('axo_accounts',{}),participants=accounts.participants||[];let max=0;participants.forEach(p=>{const m=String(p.username||'').match(/^AXO(\d{4})$/);if(m)max=Math.max(max,+m[1])});return 'AXO'+String(max+1).padStart(4,'0')}
function generateParticipantPassword(){const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);return String(bytes[0]%100000000).padStart(8,'0')}
function participantForm(i){const a=get('axo_accounts',{}),p=i!=null?a.participants[i]:null;$('overlay').innerHTML=`<div class="modalBack"><div class="modal" style="max-width:520px"><h2>${p?'Edit':'Tambah'} Peserta</h2><div class="formGrid"><div class="field"><label>Nama peserta</label><input id="pName" value="${p?esc(p.name):''}" placeholder="Nama lengkap"></div><div class="field"><label>Kelas</label><input id="pClass" value="${p?esc(p.class||''):''}" placeholder="Contoh: XII RPL 3"></div></div>${p?'':'<div class="card" style="margin-bottom:12px;color:var(--muted);font-size:12px">Username dan password akan dibuat otomatis saat disimpan.</div>'}<div class="modalActions"><button class="btn" onclick="closeOverlay()">Batal</button><button class="btn btnGreen" onclick="saveParticipant(${i!=null?i:''})">Simpan</button></div></div></div>`}
function saveParticipant(i){const name=$('pName').value.trim(),cl=$('pClass').value.trim();if(!name||!cl)return toast('Nama peserta dan kelas wajib diisi.',true);const a=get('axo_accounts',{});if(i!==null&&i!==''&&i!=null){Object.assign(a.participants[i],{name,class:cl});toast('Data peserta berhasil diperbarui')}else{const username=nextParticipantUsername(),password=generateParticipantPassword();a.participants.push({name,class:cl,username,password});toast('Peserta dibuat · Username: '+username+' · Password: '+password)}set('axo_accounts',a);closeOverlay();renderParticipantAdmin($('operatorContent'))}
function renderScores(el){const exams=get('axo_exams',[]),results=get('axo_results',[]),selected=window.scoreSubject||exams[0]?.subject||'',filtered=results.filter(r=>!selected||r.subject===selected);el.innerHTML=`<div class="pageHead"><div><h1>Rekap Nilai / Spreadsheet</h1><p>Nilai peserta direkap otomatis per mata pelajaran</p></div><button class="btn btnGreen" onclick="exportScores()">⇩ Ekspor Spreadsheet</button></div><div class="subjectTabs">${exams.map(e=>`<button class="${e.subject===selected?'active':''}" onclick="window.scoreSubject='${esc(e.subject)}';opPage('scores')">${esc(e.subject)}</button>`).join('')}</div><div class="stats" style="grid-template-columns:repeat(3,1fr)"><div class="stat"><div class="statTop">Peserta dinilai <b>RESULT</b></div><strong>${filtered.length}</strong></div><div class="stat"><div class="statTop">Nilai rata-rata <b>MEAN</b></div><strong>${filtered.length?Math.round(filtered.reduce((a,r)=>a+r.score,0)/filtered.length):'-'}</strong></div><div class="stat"><div class="statTop">Nilai tertinggi <b>MAX</b></div><strong>${filtered.length?Math.max(...filtered.map(r=>r.score)):'-'}</strong></div></div><div class="card" style="margin-top:10px;overflow-x:auto"><table class="table"><thead><tr><th>Nama Peserta</th><th>Username</th><th>Ujian</th><th>Mapel</th><th>Jawaban Benar</th><th>Nilai</th><th>Pengiriman</th><th>Waktu Selesai</th></tr></thead><tbody>${filtered.length?filtered.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td class="mono">${esc(r.username)}</td><td>${esc(r.title)}</td><td>${esc(r.subject)}</td><td>${r.correct}/${r.total}</td><td><span class="badge">${r.score}</span></td><td><span class="badge ${r.forced?'warn':''}">${r.forced?'Paksa':'Manual'}</span></td><td class="mono">${r.finished?new Date(r.finished).toLocaleString('id-ID'): '-'}</td></tr>`).join(''):'<tr><td colspan="8" style="text-align:center;color:var(--muted)">Belum ada nilai untuk mapel ini</td></tr>'}</tbody></table></div>`}
function exportScores(){const selected=window.scoreSubject||get('axo_exams',[])[0]?.subject||'',rows=get('axo_results',[]).filter(r=>!selected||r.subject===selected).map(r=>({Nama:r.name,Username:r.username,Ujian:r.title,Mapel:r.subject,'Jawaban Benar':`${r.correct}/${r.total}`,Nilai:r.score,Pengiriman:r.forced?'Paksa':'Manual','Waktu Selesai':r.finished?new Date(r.finished).toLocaleString('id-ID'):''}));if(!rows.length)return toast('Belum ada nilai yang dapat diekspor.',true);if(window.XLSX){const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,'Rekap Nilai');XLSX.writeFile(wb,`rekap-${selected||'nilai'}-${new Date().toISOString().slice(0,10)}.xlsx`);toast('Rekap nilai berhasil diekspor ke XLSX')}else{const cols=Object.keys(rows[0]),csv=[cols.join(','),...rows.map(row=>cols.map(c=>`"${String(row[c]??'').replace(/"/g,'""')}"`).join(','))].join('\n'),blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`rekap-${selected||'nilai'}-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(a.href);toast('Rekap nilai berhasil diekspor ke Spreadsheet CSV')}}function deleteParticipant(i){if(!confirm('Hapus peserta ini?'))return;const a=get('axo_accounts',{});a.participants.splice(i,1);set('axo_accounts',a);renderParticipantAdmin($('operatorContent'));toast('Peserta dihapus',true)}function renderMonitor(el){const exams=[...new Set(get('axo_exams',[]).map(e=>e.subject))],selected=window.monitorSubject||exams[0]||'',viol=get('axo_violations',[]).filter(v=>!selected||!v.subject||v.subject===selected),sessions=get('axo_sessions',[]).filter(s=>!selected||!s.subject||s.subject===selected),results=get('axo_results',[]).filter(r=>!selected||r.subject===selected);el.innerHTML=`<div class="pageHead"><div><h1>Monitoring / Live Traffic</h1><p>Monitoring peserta dan pelanggaran per mata pelajaran</p></div></div><div class="subjectTabs">${exams.map(s=>`<button class="${s===selected?'active':''}" onclick="window.monitorSubject='${esc(s)}';opPage('monitor')">${esc(s)}</button>`).join('')}</div><div class="grid2"><div class="card"><h3>Peserta Online / Status</h3>${sessions.length?sessions.map(s=>`<div class="statusRow"><span><b>${esc(s.username)}</b> · ${esc(s.progress||0)} soal</span><span class="badge ${s.status==='Selesai'?'':'warn'}">${esc(s.status)}</span></div>`).join(''):'<div class="statusRow"><span>Belum ada sesi aktif</span><b class="mono greenText">WAITING</b></div>'}</div><div class="card"><h3>Daftar Pelanggaran</h3>${viol.length?viol.map(v=>`<div class="statusRow"><span><b>${esc(v.user)}</b> · ${esc(v.type)}</span><span class="mono amberText">${esc(v.time)}</span></div>`).join(''):'<div class="statusRow"><span>Belum ada pelanggaran</span><b class="badge">CLEAR</b></div>'}</div></div><div class="card" style="margin-top:10px"><h3>Hasil Mapel</h3><table class="table"><thead><tr><th>Peserta</th><th>Nilai</th><th>Jawaban Benar</th><th>Mode</th></tr></thead><tbody>${results.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td class="mono greenText">${r.score}</td><td>${r.correct}/${r.total}</td><td><span class="badge ${r.forced?'warn':''}">${r.forced?'Paksa':'Manual'}</span></td></tr>`).join('')}</tbody></table></div>`}
function networkStatus(){return navigator.onLine?'ONLINE':'OFFLINE'}function participantDashboardClock(){return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}function renderParticipant(){clearInterval(liveTick);const results=get('axo_results',[]).filter(r=>r.username===activeUser.username);$('app').innerHTML=`<div class="participantApp"><header class="participantNav"><div class="participantBrand"><div class="brandLogo">AX</div><div><b>AxoExam</b><small>peserta://runtime</small></div></div><div class="participantTools"><span class="badge ${navigator.onLine?'':'red'}">● ${networkStatus()}</span><button class="navTool" onclick="openNetworkSettings()">⌁ <span>Jaringan</span></button><div class="clock participantClock">● <span id="participantClock"></span></div></div><div class="participantIdentity"><div class="avatar">${esc(activeUser.name?.charAt(0)||'P')}</div><div><b>${esc(activeUser.name)}</b><small>${esc(activeUser.class||'-')}   ·  ${esc(activeUser.username)}</small></div><button class="btn btnDanger" onclick="logout()">Keluar</button></div></header><main class="content participantContent"><div class="pageHead"><div><h1>Dashboard Peserta</h1><p>Assessment workspace   ·  semua data diperbarui realtime</p></div><span class="live"><i></i> SESSION SECURE</span></div><div class="stats"><div class="stat"><div class="statTop">Mapel tersedia <b>EXAM</b></div><strong>${get('axo_exams',[]).length}</strong></div><div class="stat"><div class="statTop">Ujian selesai <b>SYNC</b></div><strong>${results.length}</strong></div><div class="stat"><div class="statTop">Nilai rata-rata <b>MAPEL</b></div><strong>${results.length?Math.round(results.reduce((a,r)=>a+r.score,0)/results.length):'-'}</strong></div><div class="stat"><div class="statTop">Status jaringan <b>${networkStatus()}</b></div><strong style="font-size:20px">${navigator.connection?.effectiveType||'Browser'}</strong></div></div><div class="card participantExamCard"><div class="cardHead"><div><h3>Daftar Ujian & Nilai Mapel</h3><p>Pilih ujian dan masukkan token yang diberikan operator</p></div></div><div class="examTableWrap"><table class="table"><thead><tr><th>Ujian</th><th>Mata Pelajaran</th><th>Durasi</th><th>Nilai</th><th>Token</th><th>Aksi</th></tr></thead><tbody>${get('axo_exams',[]).map(e=>{const done=results.find(r=>r.examId===e.id);return `<tr><td><b>${esc(e.title)}</b></td><td><span class="subjectChip">${esc(e.subject)}</span></td><td>${e.duration} menit</td><td><span class="badge ${done?'':'warn'}">${done?done.score:'Belum dikerjakan'}</span></td><td>${done?'Selesai':`<input id="token_${e.id}" class="search examTokenInput" placeholder="Token mapel">`}</td><td>${done?'':`<button class="btn btnPrimary startBtn" onclick="startExamFromInput('${e.id}')">Mulai Ujian →</button>`}</td></tr>`}).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--muted)">Belum ada ujian aktif</td></tr>'}</tbody></table></div></div></main></div>`;liveTick=setInterval(()=>{const c=document.getElementById('participantClock');if(c)c.textContent=participantDashboardClock();if(activeRole==='participant')renderParticipantClockOnly()},1000)}function renderParticipantClockOnly(){const c=document.getElementById('participantClock');if(c)c.textContent=participantDashboardClock()}function openNetworkSettings(){if(location.protocol==='http:')toast('Jaringan browser tidak dapat mengubah koneksi Wi-Fi perangkat. Buka pengaturan Windows/Android untuk mengubah Wi-Fi.',true);else try{location.href='ms-settings:network-wifi'}catch(e){toast('Buka pengaturan jaringan perangkat untuk mengubah Wi-Fi.',true)}}function startExamFromInput(id){const token=document.getElementById('token_'+id).value.trim();startExam(id,token)}function startExam(id,tokenInput){const exams=get('axo_exams',[]),e=exams.find(x=>x.id===id);if(!e)return;if(get('axo_results',[]).some(r=>r.username===activeUser.username&&r.examId===id))return toast('Ujian sudah selesai dan tidak dapat diulang.',true);if(!tokenInput||tokenInput!==e.token)return toast('Token tidak sesuai.',true);currentExam={...e,_questions:get('axo_questions',[]).filter(q=>q.subject===e.subject)};if(!currentExam._questions.length)return toast('Ujian belum memiliki soal.',true);currentIndex=0;currentAnswers={};currentUnsure=new Set();examEnd=Date.now()+e.duration*60000;let sessions=get('axo_sessions',[]);sessions.push({username:activeUser.username,examId:id,subject:e.subject,status:'Mengerjakan',progress:0,score:null});set('axo_sessions',sessions);renderExam()}
function questionAnswered(q){const a=currentAnswers[q.id];return a!=null&&(!Array.isArray(a)||a.length>0)}function updateQuestionMenu(){document.querySelectorAll('[data-question-id]').forEach(btn=>{const id=Number(btn.dataset.questionId),q=currentExam._questions.find(x=>x.id===id);btn.style.background=currentUnsure.has(id)?'#d89b2b':questionAnswered(q)?'#158b73':'';btn.style.color=currentUnsure.has(id)||questionAnswered(q)?'#fff':''})}function setAnswer(id,v){currentAnswers[id]=v;updateQuestionMenu()}function toggleComplex(id,v){const a=Array.isArray(currentAnswers[id])?[...currentAnswers[id]]:[];const n=a.indexOf(v);n>=0?a.splice(n,1):a.push(v);currentAnswers[id]=a;updateQuestionMenu()}function toggleUnsure(id){currentUnsure.has(id)?currentUnsure.delete(id):currentUnsure.add(id);renderExam()}function renderExam(){const q=currentExam._questions[currentIndex],isLast=currentIndex===currentExam._questions.length-1;$('app').innerHTML=`<div style="min-height:100vh;background:#091426"><header class="topbar"><div class="brand" style="height:auto"><div class="brandLogo">AX</div><span>${esc(currentExam.subject)}</span></div><div class="topRight"><div class="live"><i></i><span id="examClock">${clock()}</span></div><div class="clock" id="examTimer">00:00:00</div><button class="${isLast?'btn btnGreen':'btn btnDanger'}" onclick="manualSubmit()">${isLast?'Kirim Jawaban':'Kirim Jawaban'}</button></div></header><main class="content" style="max-width:1180px"><div style="display:grid;grid-template-columns:minmax(0,1fr)220px;gap:12px"><section><div class="pageHead"><div><h1>Soal ${currentIndex+1} / ${currentExam._questions.length}</h1><p class="mono">${esc(currentExam.title)}</p></div><button class="btn ${currentUnsure.has(q.id)?'btnDanger':''}" onclick="toggleUnsure(${q.id})">⚑ Ragu-ragu</button></div><div class="card" style="min-height:430px"><h3 style="font-size:17px">${esc(q.text)}</h3><div style="display:grid;gap:9px;margin-top:22px">${q.options.map((o,i)=>q.type==='PG'?`<label style="border:1px solid var(--line);border-radius:7px;padding:14px;display:flex;gap:10px"><input type="radio" name="answer" ${currentAnswers[q.id]===i?'checked':''} onchange="setAnswer(${q.id},${i})"><span>${esc(o)}</span></label>`:`<label style="border:1px solid var(--line);border-radius:7px;padding:14px;display:flex;gap:10px"><input type="checkbox" ${Array.isArray(currentAnswers[q.id])&&currentAnswers[q.id].includes(i)?'checked':''} onchange="toggleComplex(${q.id},${i})"><span>${esc(o)}</span></label>`).join('')}</div></div><div style="display:flex;justify-content:space-between;margin-top:12px"><button class="btn" ${currentIndex===0?'disabled':''} onclick="prevQuestion()">← Sebelumnya</button><button class="btn ${isLast?'btnGreen':'btnPrimary'}" onclick="${isLast?'manualSubmit()':'nextQuestion()'}">${isLast?'Kirim Jawaban':'Selanjutnya →'}</button></div></section><aside class="card" style="align-self:start;position:sticky;top:82px"><h3>Daftar Soal</h3><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">${currentExam._questions.map((item,i)=>`<button data-question-id="${item.id}" class="btn ${currentIndex===i?'btnPrimary':''}" style="padding:0" onclick="currentIndex=${i};renderExam()">${i+1}</button>`).join('')}</div><div style="margin-top:12px;font-size:11px;color:var(--muted);line-height:1.8"><span style="color:#158b73">■ Hijau: dijawab</span><br><span style="color:#d89b2b">■ Kuning: ragu-ragu</span><br><span>■ Biru: soal aktif</span></div></aside></div></main></div>`;updateQuestionMenu();clearInterval(timerTick);timerTick=setInterval(updateTimer,1000);updateTimer()}function prevQuestion(){if(currentIndex>0){currentIndex--;renderExam()}}function nextQuestion(){if(currentIndex<currentExam._questions.length-1){currentIndex++;renderExam()}}function updateTimer(){const ms=Math.max(0,examEnd-Date.now()),s=Math.ceil(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;if($('examTimer'))$('examTimer').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;if($('examClock'))$('examClock').textContent=clock();if(ms<=0){clearInterval(timerTick);finishExam(true)}}function manualSubmit(){const qs=currentExam._questions,filled=qs.filter(q=>currentAnswers[q.id]!=null&&(!Array.isArray(currentAnswers[q.id])||currentAnswers[q.id].length)).length;if(filled<qs.length){popup('Jawaban Belum Lengkap',`${qs.length-filled} soal belum dijawab. Kirim manual diblokir sampai seluruh jawaban lengkap.`,'danger');return}popupConfirm('Kirim Jawaban?',`${filled}/${qs.length} soal sudah lengkap.`,()=>finishExam(false))}
function finishExam(forced){clearInterval(timerTick);let correct=0;currentExam._questions.forEach(q=>{const a=currentAnswers[q.id];if(q.type==='PGK'){const v=Array.isArray(a)?[...a].sort().join(','):'';if(v===[...q.answer].sort().join(','))correct++}else if(a===q.answer[0])correct++});const score=Math.round(correct/currentExam._questions.length*100),results=get('axo_results',[]);results.push({examId:currentExam.id,title:currentExam.title,subject:currentExam.subject,username:activeUser.username,name:activeUser.name,correct,total:currentExam._questions.length,score,forced,answers:currentAnswers,finished:new Date().toISOString()});set('axo_results',results);set('axo_sessions',get('axo_sessions',[]).map(s=>s.username===activeUser.username&&s.examId===currentExam.id?{...s,status:'Selesai',progress:currentExam._questions.length,score}:s));popup('Ujian Selesai',`Jawaban telah direkap${forced?' secara paksa karena timer habis':''}. Nilai Anda: <b style="font-size:22px;color:var(--green)">${score}</b>`,'success',renderParticipant)}
function popup(title,msg,type='info',onOk){window._popupOk=onOk||null;$('overlay').innerHTML=`<div class="modalBack"><div class="modal" style="max-width:460px;border-top:4px solid ${type==='danger'?'var(--red)':type==='success'?'var(--green)':'var(--amber)'}"><h2>${title}</h2><div style="color:var(--muted);font-size:13px;line-height:1.7">${msg}</div><div class="modalActions"><button class="btn btnPrimary" onclick="closeOverlay();if(window._popupOk){const f=window._popupOk;window._popupOk=null;f()}">Mengerti</button></div></div></div>`}function popupConfirm(title,msg,onYes){$('overlay').innerHTML=`<div class="modalBack"><div class="modal" style="max-width:460px"><h2>${title}</h2><div style="color:var(--muted);font-size:13px">${msg}</div><div class="modalActions"><button class="btn" onclick="closeOverlay()">Kembali</button><button class="btn btnGreen" onclick="closeOverlay();(${onYes.toString()})()">Ya, Kirim</button></div></div></div>`}
